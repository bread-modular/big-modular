<text x="318" y="120.0" font-size="2.35">Each block: X 5.80 x Y 8.00 x Z 8.40.</text>
<text x="318" y="124.2" font-size="2.35">Origin at (3.17,Yc-4,1.6), Yc=45 / 83.5.</text>
<text x="318" y="128.4" font-size="2.35">Panel hole: Xlocal=1.73, Ylocal=4, axis Z.</text>
<text x="318" y="132.6" font-size="2.35">Carrier hole: Ylocal=4, Zlocal=4.40, axis X.</text>
<text x="318" y="136.8" font-size="2.35">Both M2 x 0.4 blind taps.</text>
<text x="318" y="141.0" font-size="2.35">Full thread &gt;=2.6; TOTAL depth &lt;=2.8,</text>
<text x="318" y="145.2" font-size="2.35">including drill point. Flat-bottom process.</text>
<text x="318" y="149.4" font-size="2.35">4 x M2 x 4; engagement nominal 2.4.</text>
<text x="318" y="153.6" font-size="2.35">Side head h&lt;=1.2, diameter &lt;=3.8.</text>
<text x="318" y="157.8" font-size="2.35">Exact low-head screw is UNSELECTED.</text>
<text x="318" y="162.0" font-size="2.35">Faces/axes target +/-0.05; block +/-0.10.</text>
<text x="318" y="166.2" font-size="2.35">Bare FR4 contact; copper keepout required.</text>
<text x="318" y="170.4" font-size="2.35">Two support points, Y separation 38.50.</text>
<text x="248" y="204" font-size="2.45">Panel/PCB thickness tolerance changes engagement and alignment.</text>
<text x="248" y="208" font-size="2.45">Screw heads remain inside X=0.37..8.97 nominal (2HP width 9.8).</text>
<text x="248" y="212" font-size="2.45">Keep Y&lt;10 and Y&gt;118.5 free for rail access; PCB begins at Y=14.</text>
<text x="248" y="216" font-size="2.45">No independent USB shell cradle supplied: stakes -&gt; PCB -&gt; blocks.</text>
<text x="248" y="220" font-size="2.45">Insertion force / cable torque / FR4 flex MUST be tested.</text>
<line x1="10" y1="232" x2="410" y2="232" stroke="#284c69" stroke-width=".25" class=""/>
<text x="11" y="239" font-size="2.55">MOUNTING DECISION: Doepfer A100FP.gif shows x=7.5, d=3.2, y=3 from both edges; pitch 122.5.</text>
<text x="11" y="244" font-size="2.55">CORRECTED rail holes to x=7.5, diameter 3.2: 0.7 FR4 web. A 5 x 3.2 slot runs off-panel, so NOT used.</text>
<text x="11" y="249" font-size="2.55">Standard 6 mm M3 heads overhang by 0.7: adjacent-module conflict. Narrow head / panel strength NOT resolved.</text>
<text x="11" y="254" font-size="2.55">M3 x 6 through 1.6 panel + 0.5 washer leaves 3.9 nominal thread reach: verify actual rail depth; do not bottom out.</text>
<text x="11" y="259" font-size="2.55">Assembly: tap blocks -&gt; bolt to bare carrier -&gt; solder J1 stakes -&gt; loosely bolt panel -&gt; align USB aperture -&gt; tighten -&gt; fit tie/harness -&gt; rack.</text>
<text x="11" y="264" font-size="2.55">Profile/aperture target +/-0.10; only 0.43/0.445 nominal shell clearance per side. Trial plugs / worst-case stack remain blockers.</text>
<text x="11" y="269" font-size="2.55">Sources: doepfer.de/a100_man/A100FP.gif + a100m_e.htm; GCT USB4105 drawing geometry retained from A0. See mechanics.md.</text>
