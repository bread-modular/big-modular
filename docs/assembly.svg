<text x="165" y="58.0" font-size="2.6">Main PCB: 100.5 x 30 x 1.6</text>
<text x="165" y="62.5" font-size="2.6">Front edge Z2; rear Z32</text>
<text x="165" y="67.0" font-size="2.6">Two local bracket cutbacks to Z10</text>
<text x="165" y="71.5" font-size="2.6">PCB depth behind panel rear: 30.4</text>
<text x="165" y="76.0" font-size="2.6">NOT finished cabled depth.</text>
<path d="M162.2,129.7375 L184,129.7375" fill="none" stroke="#375775" stroke-width=".25" stroke-dasharray="1.5 1"/>
<text x="166" y="146.0" font-size="2.6">J7: 16 numbered solder-through lands</text>
<text x="166" y="150.5" font-size="2.6">J2: keyed 2x8 MALE IDC on flying lead</text>
<text x="166" y="155.0" font-size="2.6">75-100mm lead, strain-relieved</text>
<text x="166" y="159.5" font-size="2.6">Connector not squeezed into 2HP.</text>
<text x="166" y="164.0" font-size="2.6">No third PCB.</text>
<text x="117" y="227.0" font-size="2.6">USB native footprint unchanged; whole PCB moved right 1.53mm.</text>
<text x="117" y="231.5" font-size="2.6">Back face X3.1 / component face X4.7.</text>
<text x="117" y="236.0" font-size="2.6">Plain L is on BACK face; countersink in plastic only.</text>
<text x="117" y="240.5" font-size="2.6">USB and LED/reset panel openings follow the new axes.</text>
