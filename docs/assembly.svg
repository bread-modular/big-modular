<text x="12" y="15" font-size="5">V1 TOP USB / SINGLE POWER LED | TWO BOARDS + TWO PLAIN M3 L BRACKETS</text>
<text x="12" y="23" font-size="2.8">Front panel + perpendicular main PCB. No middle board, spacers or UI headers. mm. V1 ROUTING PREPARATION; 60 POWER PARTS STAGED OFF-BOARD.</text>
