<text x="269" y="191.0" font-size="2.6">D10: ordinary 3mm through-hole LED, bent 90 deg.</text>
<text x="269" y="195.5" font-size="2.6">SW1: E-Switch TL3340AF160QG, SMT.</text>
<text x="269" y="200.0" font-size="2.6">Three signal pads + two solder anchors.</text>
<text x="269" y="204.5" font-size="2.6">Front-side fine-tip soldering; 2 locating holes.</text>
<text x="269" y="209.0" font-size="2.6">3.3mm body height; axis X6.4, recessed Z2.05.</text>
<text x="269" y="213.5" font-size="2.6">Pins1+3 common; pin2 other contact. No plunger.</text>
<text x="269" y="229.0" font-size="2.6">12 V power output pin pairs:</text>
<text x="269" y="233.5" font-size="2.6">1-2: -12V | 3-8: GND | 9-10: +12V</text>
<text x="269" y="238.0" font-size="2.6">11-12: +5V | 13-16: NOT CONNECTED</text>
<text x="269" y="242.5" font-size="2.6">POWER OUTPUT, not a rack power input!</text>
<text x="269" y="247.0" font-size="2.6">Do not connect to another active PSU.</text>
<text x="12" y="282" font-size="2.7">No routing. LED/reset remain isolated. Converter placement, thermal/power safety, actual bracket/connector fit remain unqualified.</text>
