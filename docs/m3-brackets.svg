<rect x="57.199999999999996" y="121.57500000000002" width="16.8" height="44.449999999999996" fill="#b8b8b8" stroke="#375775" stroke-width=".25"/>
<rect x="58.6" y="38.8" width="21" height="56" fill="none" stroke="#375775" stroke-width=".25" stroke-dasharray="1.5 1"/>
<rect x="25" y="133.3" width="56" height="21" fill="none" stroke="#375775" stroke-width=".25" stroke-dasharray="1.5 1"/>
<text x="101" y="46.0" font-size="2.7">Local origin = assembly X0.1 / Z1.6</text>
<text x="101" y="50.5" font-size="2.7">Overall 9.2 X x 10 Y x 18.4 Z</text>
<text x="101" y="55.0" font-size="2.7">BOTH legs are 3.0mm thick.</text>
<text x="101" y="59.5" font-size="2.7">Upright on PCB BACK face (B.Cu X3.1).</text>
<text x="101" y="64.0" font-size="2.7">Plain nuts sit OUTSIDE the printed L.</text>
<text x="101" y="68.5" font-size="2.7">No slots, captive pockets, roofs or inserts.</text>
<text x="101" y="83.0" font-size="2.7">HOLES / LOCAL DIMENSIONS</text>
<text x="101" y="87.5" font-size="2.7">Front: X6.3 / Y5.0, diameter3.2</text>
<text x="101" y="92.0" font-size="2.7">Side: Y5.0 / Z13.4, diameter3.2</text>
<text x="101" y="96.5" font-size="2.7">Side countersink: diameter6.0 x 90 deg</text>
<text x="101" y="101.0" font-size="2.7">Depth1.4; leaves1.6 of straight bore.</text>
<text x="101" y="105.5" font-size="2.7">Countersink PLASTIC ONLY, never FR4.</text>
<text x="101" y="121.0" font-size="2.7">FASTENERS</text>
<text x="101" y="125.5" font-size="2.7">Front M3x8 pan/button, head &lt;=6 dia</text>
<text x="101" y="130.0" font-size="2.7">Side M3x8 flat countersunk (90 deg)</text>
<text x="101" y="134.5" font-size="2.7">Side length includes head; seat it flush.</text>
<text x="101" y="139.0" font-size="2.7">4 loose plain M3 nuts: AF&lt;=5.5, h&lt;=2.4</text>
<text x="101" y="143.5" font-size="2.7">No washers or tall nyloc nuts.</text>
<text x="101" y="148.0" font-size="2.7">Minimum nominal thread exit: 1.0 each.</text>
<text x="101" y="164.0" font-size="2.7">FIT LIMITS</text>
<text x="101" y="168.5" font-size="2.7">Front nut-to-upright: only 0.125 nominal</text>
<text x="101" y="173.0" font-size="2.7">Nut swept right edge X9.575 (panel9.8)</text>
<text x="101" y="177.5" font-size="2.7">Side head flush to0.3mm below face</text>
<text x="101" y="182.0" font-size="2.7">Side screw tip X8.1..8.4</text>
<text x="101" y="186.5" font-size="2.7">Measure ABS shrinkage and actual nuts.</text>
<text x="263" y="35" font-size="3.2">HOLE COORDINATES / MOUNTING</text>
<text x="263" y="47.0" font-size="2.8">Panel: X6.4, Y22 / Y106.5, diameter3.2</text>
<text x="263" y="51.5" font-size="2.8">Main PCB: same Y, Z15, diameter3.2</text>
<text x="263" y="56.0" font-size="2.8">Bracket pitch:84.5; panel holes moved +1.5 X.</text>
<text x="263" y="60.5" font-size="2.8">PCB plane and main mounting holes unchanged.</text>
<text x="263" y="77" font-size="3.1">FRONT FACE / LOCAL XY</text>
<rect x="273" y="84" width="55.199999999999996" height="60" fill="#e8b396" stroke="#375775" stroke-width=".25"/>
<circle cx="310.8" cy="114" r="9.600000000000001" fill="white" stroke="#375775" stroke-width=".25"/>
<path d="M291,84 L291,144" fill="none" stroke="#375775" stroke-width=".25" stroke-dasharray="1.5 1"/>
<text x="335" y="103.0" font-size="2.5">Hole (6.3,5.0)</text>
<text x="335" y="107.5" font-size="2.5">9.2 x 10 face</text>
<text x="335" y="112.0" font-size="2.5">Dashed: 3mm wall</text>
<text x="263" y="157" font-size="3.1">OUTER SIDE / LOCAL YZ</text>
<rect x="273" y="164" width="73.6" height="40" fill="#e8b396" stroke="#375775" stroke-width=".25"/>
<circle cx="326.6" cy="184" r="12" fill="none" stroke="#375775" stroke-width=".25"/>
<circle cx="326.6" cy="184" r="6.4" fill="white" stroke="#375775" stroke-width=".25"/>
<text x="263" y="213" font-size="2.7">Hole (Y5.0,Z13.4); outer circle is countersink.</text>
<text x="15" y="256.0" font-size="2.6">SERVICE OUT OF RACK: hold front nut with small pliers from +X; side nut with 5.5mm nut driver from +X.</text>
<text x="15" y="260.5" font-size="2.6">Drive screws from panel front (-Z) and bracket outer side (-X). Soldered PCB can stay fitted.</text>
<text x="15" y="265.0" font-size="2.6">Print L profile flat. ABS is a candidate, not strength approval. Trial screw seating, nut/tool access and shrinkage.</text>
<text x="263" y="235" font-size="2.5">Source: hardware/mechanics/corner_braces.scad</text>
<text x="263" y="243" font-size="2.5">SCAD only; no tested STL or physical print.</text>
</svg>
