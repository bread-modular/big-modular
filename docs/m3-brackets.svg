<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297">
<style>text{font-family:DejaVu Sans,sans-serif;fill:#19334b}</style>
<rect x="5" y="5" width="410" height="287" fill="white" stroke="#375775" stroke-width=".4"/>
<text x="12" y="15" font-size="5">A4.1 | PLAIN L BRACKET - PRINT TWO IDENTICAL PARTS</text>
<text x="12" y="23" font-size="2.8">3mm walls, two holes, no nut traps or inserts. ABS prototype. M3x8 front + M3x8 countersunk side; four loose M3 nuts.</text>
<text x="15" y="35" font-size="3.2">XZ SECTION THROUGH BOTH HOLES</text>
<rect x="24.3" y="38.8" width="68.60000000000001" height="11.200000000000001" fill="#f1dfb6" stroke="#375775" stroke-width=".25"/>
<polygon points="25,50 89.39999999999999,50 89.39999999999999,71 46,71 46,178.79999999999998 25,178.79999999999998" fill="#e8b396" stroke="#375775" stroke-width=".25"/>
<rect x="46" y="108.80000000000001" width="11.200000000000001" height="140" fill="#d6e3f1" stroke="#375775" stroke-width=".25"/>
<rect x="57.89999999999999" y="50" width="22.400000000000002" height="21" fill="white" stroke="#375775" stroke-width=".25"/>
<rect x="25" y="132.60000000000002" width="21" height="22.400000000000002" fill="white" stroke="#375775" stroke-width=".25"/>
<polygon points="25,122.8 34.8,132.60000000000002 34.8,155 25,164.79999999999998" fill="white" stroke="#375775" stroke-width=".25"/>
